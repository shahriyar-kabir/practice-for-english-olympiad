name: Test and deploy Wizpiko to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, feature/wizpiko-complete-learning-hub]

permissions:
  contents: read
  pages: read

concurrency:
  # PR validation must not wait for a stalled production Pages deployment.
  group: ${{ github.event_name == 'pull_request' && format('wizpiko-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  # A newer production commit supersedes any stalled Pages deployment.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test puzzles and game
        run: npm test
      - name: Test guardian consent database and RLS
        run: npm run test:guardian-db
      - name: Test account release migration and data isolation
        run: npm run test:accounts
      - name: Test public support database and rate limits
        run: npm run test:public-support
      - name: Test learning certificates and private data access
        run: node scripts/test-learning-certificates.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check guardian Edge Function
        run: deno check supabase/functions/guardian-consent/index.ts
      - name: Check public support Edge Function
        run: deno check --config supabase/functions/public-support/deno.json --frozen supabase/functions/public-support/index.ts
      - name: Check learning and certificate Edge Functions
        run: deno check supabase/functions/learning-certificates/index.ts supabase/functions/certificate-verification/index.ts
      - name: Verify Supabase public configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing public Supabase URL or key in Actions repository variables."
            exit 1
          fi
          echo "Supabase build configuration available (values hidden)."
      - name: Build website
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Provide client-side deep-link fallback for GitHub Pages
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
