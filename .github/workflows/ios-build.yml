name: Build Wizpiko for iPhone and iPad

on:
  workflow_dispatch:
  push:
    branches: [feature/wizpiko-ios]
  pull_request:
    branches: [main]
    paths: ['ios/**', 'src/**', 'package*.json', 'capacitor.config.ts', 'vite.ios.config.ts', 'ios.html', 'scripts/ios/**', '.github/workflows/ios-build.yml']

permissions:
  contents: read

concurrency:
  group: wizpiko-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Install locked dependencies
        run: npm ci
      - name: Test learning, accounts and mobile policies
        run: npm test
      - name: Verify public app configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository variable'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'Missing VITE_SUPABASE_ANON_KEY repository variable'; exit 1; }
      - name: Bundle app and native plugins
        run: npm run ios:sync
      - name: Check app packaging
        run: npm run ios:check
      - name: Compile iPhone and iPad simulator app
        run: |
          mkdir -p ios-build
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build > ios-build/simulator-build.log 2>&1 || { tail -100 ios-build/simulator-build.log; exit 1; }
          codesign --verify --deep --strict ios-build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent ios-build/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios-build/Wizpiko-Simulator.app.zip
      - name: Capture iPhone simulator preview
        timeout-minutes: 6
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" ios-build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE_ID" com.wizpiko.app > ios-build/simulator-runtime.log 2>&1 || { cat ios-build/simulator-runtime.log; xcrun simctl spawn "$DEVICE_ID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "com.wizpiko.app"' > ios-build/simulator-system.log; exit 1; }
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.wizpiko.app data)
          STARTUP="$CONTAINER/Library/Application Support/Wizpiko/startup.json"
          for attempt in $(seq 1 12); do
            if test -f "$STARTUP"; then
              if python3 -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1])).get("state") in ["ready","failed"] else 1)' "$STARTUP"; then break; fi
            fi
            sleep 5
          done
          xcrun simctl io "$DEVICE_ID" screenshot ios-build/Wizpiko-iPhone-preview.png
          test ! -f "$STARTUP" || cp "$STARTUP" ios-build/startup.json
          xcrun simctl spawn "$DEVICE_ID" log show --last 3m --style compact --predicate 'process == "App"' > ios-build/simulator-system.log
          python3 -c 'import json,sys;v=json.load(open(sys.argv[1]));assert v.get("state")=="ready",v;print("PASS native app reached its learning interface")' "$STARTUP" || { tail -50 ios-build/simulator-runtime.log; tail -50 ios-build/simulator-system.log; exit 1; }
          xcrun simctl shutdown "$DEVICE_ID"
      - name: Create unsigned iPhone archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath ios-build/Wizpiko.xcarchive CODE_SIGNING_ALLOWED=NO archive > ios-build/device-build.log 2>&1 || { tail -100 ios-build/device-build.log; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent ios-build/Wizpiko.xcarchive ios-build/Wizpiko-Unsigned.xcarchive.zip
      - name: Explain build outputs
        if: always()
        run: |
          printf '%s\n' 'Wizpiko iOS build' 'Simulator .app: for an iOS simulator on a Mac.' 'Unsigned archive: native iPhone/iPad app compiled successfully, not installable until signed.' 'TestFlight requires an Apple Developer membership and signing configuration.' 'This workflow does not publish the website or submit an app to Apple.' > ios-build/READ-ME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wizpiko-iOS-${{ github.run_number }}
          path: |
            ios-build/*.zip
            ios-build/*.png
            ios-build/*.log
            ios-build/startup.json
            ios-build/READ-ME.txt
          retention-days: 14
